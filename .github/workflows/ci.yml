name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install Chromium for observer tests
        working-directory: packages/vibehard
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Fast unit tests
        working-directory: packages/vibehard
        run: >-
          npx vitest run
          test/cli.test.ts test/config.test.ts test/touched.test.ts
          test/indexer.test.ts test/ast-forms.test.ts test/init.test.ts
          test/observer.test.ts test/timing.test.ts test/perf-fixture.test.ts
          test/playwright-adapter.test.ts test/puppeteer-adapter.test.ts
          test/delegation.test.ts test/support-graph.test.ts
      - run: npx vibehard --help
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: verifier+selector (tiny-app, Playwright)
            files: test/verifier.test.ts test/selector.test.ts test/delegation-chunks.test.ts
            browsers: playwright
          - name: next-fullstack
            files: test/next-fullstack.test.ts
            browsers: playwright
          - name: next-express
            files: test/next-express.test.ts
            browsers: playwright
          - name: plain-puppeteer + conformance
            files: test/plain-puppeteer.test.ts test/conformance.test.ts
            browsers: playwright
          - name: next-cypress
            files: test/next-cypress.test.ts
            browsers: cypress
          - name: two-frontends
            files: test/two-frontends.test.ts
            browsers: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm ci also fetches the Puppeteer Chrome and Cypress binaries
      # (postinstall) into the default per-user caches.
      - run: npm ci
      - name: Install Playwright Chromium (+ shared browser system deps)
        if: matrix.browsers == 'playwright'
        working-directory: packages/vibehard
        run: npx playwright install --with-deps chromium
      - name: Install Cypress system deps
        if: matrix.browsers == 'cypress'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev
          libnss3 libxss1 libasound2t64 libxtst6 xauth
      - run: npm run build
      - name: ${{ matrix.name }}
        working-directory: packages/vibehard
        run: npx vitest run ${{ matrix.files }}
